<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>QA · 模型朝向</title>
<style>html,body{margin:0;height:100%;background:#20262b;overflow:hidden}canvas{display:block}
#hud{position:fixed;left:10px;top:8px;color:#dfe6ea;font:13px/1.6 Consolas,monospace;z-index:5}
#row{position:fixed;left:0;bottom:0;right:0;height:0}
</style>
<script type="importmap">{"imports":{"three":"/modules/three/build/three.module.js","three/addons/":"/modules/three/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas><div id="hud">loading…</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const params=new URLSearchParams(location.search);
const files=(params.get('models')||'three-Soldier.glb,zombie-animated.glb,zombie.glb').split(',');
const clipFilter=params.get('clip')||'';
const canvas=document.getElementById('c'),hud=document.getElementById('hud');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;
const cols=files.length,cellW=Number(params.get('cw')||420),cellH=Number(params.get('ch')||560);
renderer.setSize(cols*cellW,cellH);
const loader=new GLTFLoader();
const cameras=[],scenes=[];
function normalize(gltf,height,rotation){
  const model=gltf.scene,box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
  const scale=height/size.y;model.scale.multiplyScalar(scale);model.position.set(-center.x*scale,-box.min.y*scale,-center.z*scale);
  const pivot=new THREE.Group();pivot.add(model);pivot.rotation.y=rotation;
  return {root:pivot,animations:gltf.animations};
}
const results=[];
function detectFacing(obj){
  obj.updateMatrixWorld(true);
  const bones=[];obj.traverse(o=>{if(o.isBone)bones.push(o);});
  const pick=re=>bones.find(b=>re.test(b.name.toLowerCase()));
  const foot=pick(/left.*(foot|ankle)|(foot|ankle).*left|l_foot/)||pick(/(foot|ankle)/);
  const toe=pick(/left.*toe|toe.*left|l_toe/)||pick(/toe/);
  if(!foot||!toe)return {ok:false,why:'no foot/toe bones',bones:bones.length};
  const f=foot.getWorldPosition(new THREE.Vector3()),t=toe.getWorldPosition(new THREE.Vector3());
  const v=new THREE.Vector3(t.x-f.x,0,t.z-f.z);
  const len=v.length();if(len<1e-5)return {ok:false,why:'zero foot->toe',bones:bones.length};
  v.normalize();
  return {ok:true,bones:bones.length,foot:foot.name,toe:toe.name,footToe:[+v.x.toFixed(2),+v.z.toFixed(2)],
    suggestsForward:v.z<0?'-Z (rot 0)':'+Z (rot PI)',absZ:+Math.abs(v.z).toFixed(2)};
}
for(let i=0;i<files.length;i++){
  const scene=new THREE.Scene();scene.background=new THREE.Color('#2b3238');
  scene.add(new THREE.HemisphereLight('#ffffff','#404040',2.2));
  const d=new THREE.DirectionalLight('#fff6e2',2.6);d.position.set(3,6,4);scene.add(d);
  const grid=new THREE.GridHelper(6,12,0x55606a,0x39424a);scene.add(grid);
  // forward marker at -Z (game convention for "in front of the model")
  const marker=new THREE.Mesh(new THREE.ConeGeometry(.22,.7,12),new THREE.MeshStandardMaterial({color:'#4fd18b',emissive:'#2f7a52'}));
  marker.position.set(0,.35,-2.1);marker.rotation.x=Math.PI;scene.add(marker);
  const back=new THREE.Mesh(new THREE.BoxGeometry(.4,.4,.4),new THREE.MeshStandardMaterial({color:'#c96a5c'}));
  back.position.set(0,.2,2.1);scene.add(back);
  const camera=new THREE.PerspectiveCamera(38,cellW/cellH,.05,100);
  const dist=Number(params.get('dist')||3.4),eye=Number(params.get('eye')||1.35),look=Number(params.get('look')||.95);
  camera.position.set(0,eye,dist);camera.lookAt(0,look,0);
  scenes.push(scene);cameras.push(camera);
  const file=files[i];
  try{
    const gltf=await loader.loadAsync('/assets/shooter/'+(file.includes('/')?file:'')+ (file.includes('/')?'' : file));
    const rot=Number(params.get('rot')||0);
    const facing=detectFacing(gltf.scene);
    const {root,animations}=normalize(gltf,1.8,rot);
    scene.add(root);
    let clip=null;
    if(animations?.length){
      const want=clipFilter||'walk';
      clip=animations.find(a=>a.name.toLowerCase().includes(want))||animations[0];
      const mixer=new THREE.AnimationMixer(root);mixer.clipAction(clip).play();
      window.__mixers=window.__mixers||[];window.__mixers.push(mixer);
    }
    results.push({file,rot,clips:animations.map(a=>a.name),playing:clip?.name||null,facing});
  }catch(e){hud.textContent='FAILED '+file+': '+e.message;console.error(e);}
}
hud.innerHTML=results.map(r=>`${r.file}<br>&nbsp;&nbsp;rot=${r.rot} clip=${r.playing} facing=${JSON.stringify(r.facing)}<br>&nbsp;&nbsp;clips=${r.clips.join(', ')}`).join('<br>');
function loop(){
  requestAnimationFrame(loop);
  const dt=1/60;for(const m of window.__mixers||[])m.update(dt);
  renderer.setScissorTest(true);
  for(let i=0;i<cols;i++){
    renderer.setViewport(i*cellW,0,cellW,cellH);renderer.setScissor(i*cellW,0,cellW,cellH);
    renderer.render(scenes[i],cameras[i]);
  }
  renderer.setScissorTest(false);
}
loop();
window.__qaReady=true;
</script></body></html>
